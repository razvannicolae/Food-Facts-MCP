[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usda-mcp"
version = "0.1.0"
description = "USDA FoodData Central MCP Server — live API backed"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
usda-mcp-server = "usda_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/usda_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
