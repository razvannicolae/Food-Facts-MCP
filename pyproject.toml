[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "food-facts-mcp"
version = "0.3.0"
description = "Food Facts MCP — USDA FoodData Central + FatSecret"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
food-facts-server = "food_facts_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/food_facts_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
